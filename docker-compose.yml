services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: swift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-swift_validator_database}
      POSTGRES_USER:     ${POSTGRES_USER:-swift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swift-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swift} -d ${POSTGRES_DB:-swift_validator_database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ──────────────────────────────────────────────────────────────
  minio:
    # Épinglé par digest (l'image :latest déjà validée localement) — un tag
    # mouvant en prod casserait la reproductibilité du déploiement.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: swift-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-swiftminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme_minio_32chars}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      # Port S3 exposé : requis pour que le navigateur télécharge les PDF via URL présignée
      - "${MINIO_API_PORT:-9000}:9000"
    networks:
      - swift-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init (bucket creation) ───────────────────────────────────────
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: swift-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-swiftminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme_minio_32chars}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb local/swift-documents --ignore-existing &&
        mc mb local/swift-reports   --ignore-existing &&
        mc mb local/mlflow          --ignore-existing &&
        mc anonymous set none local/swift-documents &&
        mc anonymous set none local/swift-reports &&
        mc anonymous set none local/mlflow &&
        echo 'MinIO buckets ready'
      "
    networks:
      - swift-net
    restart: on-failure

  # ── Python AI + PDF Service (Flask) ───────────────────────────────────
  ai-service:
    build:
      context: ./swift-validator-ia
      dockerfile: Dockerfile
    # Image taggée par version (MLOps) : jamais de :latest implicite.
    # Incrémenter PLATFORM_VERSION dans .env à chaque release.
    image: swift-validator/ai-service:${PLATFORM_VERSION:-2.1.0}
    container_name: swift-ai
    restart: unless-stopped
    ports:
      # Lié à 127.0.0.1 uniquement : sert au test de parité local ↔ conteneur
      # (scripts/parity_check.py) — pas d'exposition réseau externe.
      - "127.0.0.1:5001:5000"
    environment:
      FLASK_ENV:        ${FLASK_ENV:-production}
      PYTHONUNBUFFERED: "1"
      # Parité prod/local : device d'inférence unique (voir config/model_registry.py)
      SWIFT_INFERENCE_DEVICE: "cpu"
      MINIO_ENDPOINT:   minio:9000
      # Endpoint PUBLIC (vu par le navigateur) pour signer les URLs de téléchargement
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-swiftminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme_minio_32chars}
      MINIO_BUCKET_REPORTS: swift-reports
      MINIO_SECURE:     "false"
      # Validation externe : chemin ABSOLU du cache sanctions (indépendant du CWD)
      SANCTIONS_DATA_DIR: /app/data/scraping
      CACHE_MAX_AGE_DAYS: "30"
      # Cache HuggingFace + easyocr : évite le re-téléchargement des modèles à chaque démarrage
      HF_HOME:              /app/.cache/huggingface
      TRANSFORMERS_CACHE:   /app/.cache/huggingface
      EASYOCR_MODULE_PATH:  /app/.cache/easyocr
      # Mode offline : modèles déjà en cache (pré-remplis) → zéro requête réseau HF
      HF_HUB_OFFLINE:       "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Modèles ML montés en lecture seule — jamais inclus dans l'image
      - ./swift-validator-ia/models:/app/models:ro                    # 3.5 GB (risk, clause, nli, ner)
      - ./swift-validator-ia/release2/models:/app/release2/models:ro  # 19 GB (LayoutLM, Donut, classifiers)
      - ./swift-validator-ia/release2/data:/app/release2/data:ro      # 4.7 GB (datasets release2)
      # Modèles RiskMLEngine (XGBoost + SHAP) — source de vérité = hôte (évite les soucis de cache/encodage du build)
      - ./swift-validator-ia/services/risk_service/models:/app/services/risk_service/models:ro
      # Cache sanctions EN LECTURE-ÉCRITURE — les refresh du scheduler persistent sur l'hôte
      - ./swift-validator-ia/data/scraping:/app/data/scraping
      # Caches modèles HF/easyocr persistés (1er run télécharge, ensuite instantané)
      - ./swift-validator-ia/.hf_cache:/app/.cache/huggingface
      - ./swift-validator-ia/.easyocr_cache:/app/.cache/easyocr
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - swift-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 420s   # warmup complet (NLP + Risk + LayoutLM/Donut) avant de servir

  # ── Spring Boot API ────────────────────────────────────────────────────
  api:
    build:
      context: ./swift-validator-backend
      dockerfile: Dockerfile
    image: swift-validator/api:${PLATFORM_VERSION:-2.1.0}
    container_name: swift-api
    restart: unless-stopped
    environment:
      # DB
      DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swift_validator_database}
      DB_USERNAME: ${POSTGRES_USER:-swift}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # MinIO
      MINIO_ENABLED:     "true"
      MINIO_ENDPOINT:    http://minio:9000
      # Endpoint PUBLIC (vu par le navigateur) pour signer les URLs de téléchargement
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY:  ${MINIO_ACCESS_KEY:-swiftminio}
      MINIO_SECRET_KEY:  ${MINIO_SECRET_KEY:-changeme_minio_32chars}
      MINIO_BUCKET_NAME: swift-documents
      MINIO_BUCKET_REPORTS: swift-reports
      # Python AI
      PYTHON_PIPELINE_URL: http://ai-service:5000
      # Auth
      JWT_SECRET:      ${JWT_SECRET:-changeme_jwt_secret_32chars_min}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Frontend CORS
      FRONTEND_ORIGIN:     http://localhost
      FRONTEND_ORIGIN_ALT: http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - swift-net
    healthcheck:
      # Alpine JRE n'a pas curl — wget est présent
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Angular Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./swift_validator_frontend
      dockerfile: Dockerfile
    image: swift-validator/frontend:${PLATFORM_VERSION:-2.1.0}
    container_name: swift-frontend
    restart: unless-stopped
    networks:
      - swift-net

  # ── MLflow (registre de modèles + tracking) ───────────────────────────
  # PUREMENT ADDITIF : aucun service n'en dépend, aucun code applicatif ne
  # l'appelle pendant une analyse. S'il tombe, la plateforme est intacte.
  # Ressources BORNÉES : ne peut jamais empiéter sur le service IA.
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: swift-validator/mlflow:${PLATFORM_VERSION:-2.1.0}
    container_name: swift-mlflow
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      # Artefacts dans MinIO (bucket 'mlflow' dédié, API S3)
      AWS_ACCESS_KEY_ID:     ${MINIO_ACCESS_KEY:-swiftminio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-changeme_minio_32chars}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - mlflow_data:/mlflow
    ports:
      # UI accessible depuis le poste uniquement (démo soutenance)
      - "127.0.0.1:5500:5000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - swift-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: swift-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - swift-net

networks:
  swift-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  mlflow_data:
    driver: local
