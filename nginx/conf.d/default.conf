server {
    listen 80;
    server_name _;

    client_max_body_size 55M;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;
    proxy_connect_timeout 75s;

    # Résolveur DNS interne Docker : ré-résout les conteneurs à chaque requête.
    # Évite les 502 après un rebuild/recreate (IP de conteneur changée).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Angular SPA ────────────────────────────────────────
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Téléchargement PDF (streaming sans buffer) ─────────
    # (placé avant /api/ — nginx choisit le préfixe le plus long)
    location /api/reports/download/ {
        set $api_dl http://api:8080;
        proxy_pass         $api_dl;
        proxy_buffering    off;
        proxy_set_header   Host $host;
    }

    # ── Spring Boot API ────────────────────────────────────
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Actuator (santé interne seulement) ─────────────────
    location /actuator/ {
        set $api_act http://api:8080;
        proxy_pass   $api_act;
        allow        127.0.0.1;
        allow        10.0.0.0/8;
        deny         all;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
